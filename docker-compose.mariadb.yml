# Overlay fuer die MariaDB-Variante. Nur zusammen mit docker-compose.yml nutzen:
#
#   docker compose -f docker-compose.yml -f docker-compose.mariadb.yml up -d
#
# Sinnvoll ab mehreren tausend Titeln oder mehreren parallelen Nutzern - bei
# SQLite serialisiert jeder Schreibzugriff.
#
# Achtung: ein Wechsel von SQLite auf MariaDB migriert keine Daten. Vorher im
# Admin-Panel exportieren und nach dem Umstieg wieder importieren.

services:
  app:
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: movieshelf
      DB_USERNAME: movieshelf
      # Vor dem ersten Start aendern - muss zu MARIADB_PASSWORD unten passen.
      DB_PASSWORD: change-me
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: movieshelf-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: movieshelf
      MARIADB_USER: movieshelf
      MARIADB_PASSWORD: change-me
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - movieshelf-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  movieshelf-mariadb:
