name: Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'composer.lock'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'tessaa/movieshelf' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 ist Pflicht: ein grosser Teil der Selfhoster laeuft auf NAS,
      # Raspberry Pi oder Apple Silicon.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Bei Pull Requests nur bauen, nicht pushen.
      - name: GHCR-Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub ist optional: fehlen die Secrets, wird nur nach GHCR
      # gepusht statt den Build scheitern zu lassen (z.B. in Forks).
      - name: Docker-Hub-Login
        id: dockerhub
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.dockerhub.outcome == 'success' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          # QEMU-Emulation macht arm64 langsam, daher nur fuer echte Releases.
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ github.event_name == 'pull_request' }}

      # Die Beschreibung auf Docker Hub kommt aus der README, damit die
      # Repo-Seite dort nicht leer bleibt.
      - name: Docker-Hub-Beschreibung aktualisieren
        if: steps.dockerhub.outcome == 'success' && startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "MovieShelf - dein digitales Filmregal, selfhosted"
          readme-filepath: ./README.md

      # Rauchtest: Container hochfahren und den Health-Endpoint abfragen.
      - name: Container testen
        if: github.event_name == 'pull_request'
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name smoke -p 8080:8080 \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e APP_ENV=production -e APP_DEBUG=false \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/up; then
              echo "Health-Check erfolgreich"
              exit 0
            fi
            sleep 5
          done
          echo "Container wurde nicht gesund:"
          docker logs smoke
          exit 1
