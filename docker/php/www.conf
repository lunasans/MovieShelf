[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; dynamic passt fuer Selfhosting: wenig Last im Leerlauf, Luft bei Importen.
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Gegen Speicherlecks in lang laufenden Workern.
pm.max_requests = 500

; php-fpm loggt nach stderr, supervisor faengt es ein.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
