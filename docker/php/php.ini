; Produktions-Defaults fuer den Container.
expose_php = Off
memory_limit = 512M
max_execution_time = 300

; Muss zu client_max_body_size in der nginx.conf passen.
upload_max_filesize = 64M
post_max_size = 64M

date.timezone = ${TZ}

; Fehler gehen ins Container-Log, nie in die Response.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Der Code im Image ist unveraenderlich - kein Grund, Dateien zu pruefen.
opcache.validate_timestamps = 0
