# nginx im Vordergrund - supervisor uebernimmt das Prozess-Management.
daemon off;
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Zugriffslog nach stdout, damit `docker logs` alles sieht.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # Cover-Uploads koennen gross sein. Muss zu post_max_size in der php.ini passen.
    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # TLS und Security-Header macht der Reverse-Proxy davor.
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Gebaute Assets sind content-hashed und duerfen dauerhaft gecacht werden.
        location /build/ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~* \.(ico|jpg|jpeg|png|gif|webp|avif|svg|woff|woff2|ttf)$ {
            expires 30d;
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;
            # Importe und Bild-Verarbeitung koennen laenger laufen.
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Versteckte Dateien nie ausliefern (.env, .git-Reste, ...).
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
