[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Alle Programme loggen nach stdout/stderr des Containers.
[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
priority=20
; nginx erst starten, wenn php-fpm den Socket bedienen kann.
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue-Worker: Mails an Follower, Trailer-Suche, Importe.
; --max-time laesst den Worker regelmaessig neu starten, damit Code-Aenderungen
; nach einem Update greifen und Speicher freigegeben wird.
[program:queue]
command=php /var/www/html/artisan queue:work --tries=3 --max-time=3600 --sleep=3
directory=/var/www/html
user=www-data
autostart=%(ENV_RUN_QUEUE_WORKER)s
autorestart=true
priority=30
numprocs=1
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Ersetzt den System-Cron: fuehrt den Laravel-Scheduler minuetlich aus.
; Ohne das bleibt der Heartbeat im Admin-Panel leer.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
